name: graphstrike
version: "1.0.0"
description: >
  RL environment for detecting coordinated fake social account gangs.
  An AI detective agent must identify all 10 members of a coordinated fake
  account gang before they evade detection. Round 2 adds platform-adaptive
  policy compilation (Instagram/Snapchat) with tool-based hidden-signal reveal.
  Three difficulty levels with increasing network size, decoys, and evasion events.
author: OpenENV Hackathon
tags:
  - social-network
  - fraud-detection
  - graph
  - rl
  - fake-account-detection

# ── Server configuration ──────────────────────────────────────────────────────
server:
  # Root Dockerfile: environment server only (no training loop, no AWS needed).
  # For full local training (Qwen3 + Reflexion + Hybrid Policy): server/Dockerfile
  dockerfile: Dockerfile
  port: 7860

environment_variables:
  PORT: "7860"
  HOST: "0.0.0.0"
  WORKERS: "1"
  # The environment server and /baseline endpoint work without them.

# ── Task definitions ──────────────────────────────────────────────────────────
tasks:
  - name: easy
    description: "50 accounts, 10 fakes, no evasion, 30 steps"
    win_recall: 0.8
    win_precision: 0.7
    max_steps: 30

  - name: medium
    description: "200 accounts, 10 fakes + 20 decoys, 1 evasion event, 50 steps"
    win_recall: 0.8
    win_precision: 0.7
    max_steps: 50

  - name: hard
    description: "1000 accounts, 10 fakes + 50 decoys, 4 evasion events, 80 steps"
    win_recall: 0.9
    win_precision: 0.8
    max_steps: 80

# ── Action schema ─────────────────────────────────────────────────────────────
action_schema:
  action_type:
    type: string
    enum:
      - inspect                # reveal full profile + edges (1 step)
      - investigate_network    # expand graph one hop (2 steps)
      - flag                   # mark account as fake (0 steps)
      - unflag                 # unmark account (0 steps)
      - submit                 # end episode, trigger scoring
      - get_policy             # Round 2: get platform policy (0 steps)
      - reverse_image_search   # Round 2: reveal photo_reuse_score (1 step)
      - analyze_bio            # Round 2: reveal bio_template_score (1 step)
      - check_ip               # Round 2: reveal ip_cluster_signal (2 steps)
  account_id:
    type: string
    description: "Required for all actions except submit and get_policy"

# ── Score range ───────────────────────────────────────────────────────────────
score_range: [0.0, 1.0]
grader_formula: >
  if recall >= 0.8 and precision >= 0.7:
    score = 0.55 + 0.20*recall + 0.15*precision + 0.10*efficiency
  else:
    score = 0.30*recall + 0.10*precision
