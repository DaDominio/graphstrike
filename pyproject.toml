[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fake-gang-env"
version = "1.0.0"
description = "OpenEnv environment for fake Instagram gang detection"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
]

[project.scripts]
server = "fake_gang_env.server.app:main"
generate-episodes = "fake_gang_env.server.generator:main"

[tool.hatch.build.targets.wheel]
packages = ["fake_gang_env"]
